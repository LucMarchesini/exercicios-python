<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Exercícios de Python</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.css">
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/python/python.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f6f7f9; --painel: #ffffff; --texto: #1f2328; --suave: #656d76; --borda: #d8dee4;
    --destaque: #2563eb; --destaque-texto: #ffffff; --ativa: #e8effd; --hover: #eef1f4;
    --codigo-bg: #eff1f3; --codigo: #b4235a; --erro: #c62828; --ok-bg: #e7f6ec; --falha-bg: #fdecec;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --painel: #171a21; --texto: #e6e8eb; --suave: #9aa3ad; --borda: #2b313b;
      --destaque: #4c8dff; --destaque-texto: #0b0d11; --ativa: #1f2a3d; --hover: #1d2129;
      --codigo-bg: #222733; --codigo: #ff8fb4; --erro: #ff7b72; --ok-bg: #12261a; --falha-bg: #2c1515;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; background: var(--bg); color: var(--texto);
    font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  /* barra lateral */
  #lista {
    width: 260px; flex-shrink: 0; overflow-y: auto; padding: 16px 10px;
    background: var(--painel); border-right: 1px solid var(--borda);
  }
  #lista h2 {
    margin: 4px 10px 12px; font-size: 12px; font-weight: 600;
    letter-spacing: .08em; text-transform: uppercase; color: var(--suave);
  }
  #lista div {
    padding: 10px 12px; margin-bottom: 2px; border-radius: 8px; cursor: pointer;
    font-size: 14px; line-height: 1.35; transition: background .15s;
  }
  #lista div:hover { background: var(--hover); }
  #lista div.ativa { background: var(--ativa); color: var(--destaque); font-weight: 600; }

  /* conteúdo */
  main { flex: 1; min-width: 0; overflow-y: auto; padding: 32px 40px 48px; }
  main > * { max-width: 900px; }
  #titulo { margin: 0 0 12px; font-size: 26px; line-height: 1.25; letter-spacing: -.01em; }
  #enunciado { margin-bottom: 20px; }
  #enunciado p { margin: 0 0 12px; }
  #enunciado ul { margin: 0 0 12px; padding-left: 22px; }
  #enunciado li { margin-bottom: 4px; }
  #enunciado code {
    font: .88em ui-monospace, "Cascadia Code", Consolas, monospace;
    background: var(--codigo-bg); color: var(--codigo); padding: 2px 6px; border-radius: 5px;
  }

  /* editor (tema escuro próprio) */
  .CodeMirror {
    height: 320px; border-radius: 10px; border: 1px solid #2b313b; padding: 6px 0;
    font: 14px/1.55 ui-monospace, "Cascadia Code", Consolas, monospace;
    background: #1b1e27; color: #e6e8eb;
  }
  .CodeMirror-gutters { background: #1b1e27; border-right: 1px solid #2b313b; }
  .CodeMirror-linenumber { color: #5c6573; }
  .CodeMirror-cursor { border-left: 2px solid #8ab4ff; }
  .CodeMirror-selected, .CodeMirror-focused .CodeMirror-selected { background: #2e3a55 !important; }
  .CodeMirror-activeline-background { background: #222633; }
  .cm-s-default .cm-keyword { color: #c792ea; }
  .cm-s-default .cm-def { color: #82aaff; }
  .cm-s-default .cm-variable, .cm-s-default .cm-variable-2 { color: #e6e8eb; }
  .cm-s-default .cm-builtin { color: #ffcb6b; }
  .cm-s-default .cm-string { color: #c3e88d; }
  .cm-s-default .cm-number { color: #f78c6c; }
  .cm-s-default .cm-comment { color: #6b7686; font-style: italic; }
  .cm-s-default .cm-operator, .cm-s-default .cm-punctuation { color: #89ddff; }
  .cm-s-default .cm-property { color: #82aaff; }
  .cm-s-default .cm-meta { color: #ffcb6b; }
  .cm-s-default .cm-bracket { color: #e6e8eb; }
  .CodeMirror-matchingbracket { color: #fff !important; text-decoration: underline; }

  /* botões */
  #botoes { margin: 14px 0; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  button {
    font: inherit; font-size: 14px; font-weight: 600; padding: 9px 18px; border-radius: 8px;
    cursor: pointer; border: 1px solid var(--borda); background: var(--painel); color: var(--texto);
    transition: filter .15s, background .15s;
  }
  button:hover:not(:disabled) { background: var(--hover); }
  #rodar { background: var(--destaque); border-color: var(--destaque); color: var(--destaque-texto); }
  #rodar:hover:not(:disabled) { background: var(--destaque); filter: brightness(1.1); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button:focus-visible { outline: 2px solid var(--destaque); outline-offset: 2px; }
  #status { color: var(--suave); font-size: 13px; }

  /* resultados */
  #nota { font-size: 18px; font-weight: 700; margin: 6px 0 12px; }
  .tabela { overflow-x: auto; border-radius: 10px; }
  table {
    border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px;
    background: var(--painel); border: 1px solid var(--borda); border-radius: 10px; overflow: hidden;
  }
  th {
    text-align: left; font-size: 12px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .05em; color: var(--suave); background: var(--hover);
  }
  th, td { padding: 10px 12px; border-bottom: 1px solid var(--borda); vertical-align: top; }
  tbody tr:last-child td { border-bottom: none; }
  td:first-child { color: var(--suave); width: 1%; }
  td:last-child { width: 1%; text-align: center; font-size: 22px; line-height: 1.1; }
  td pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 13px/1.5 ui-monospace, Consolas, monospace; }
  .erro { color: var(--erro); margin-top: 4px !important; }

  /* celular */
  @media (max-width: 760px) {
    body { flex-direction: column; height: auto; }
    #lista {
      width: auto; display: flex; gap: 6px; overflow-x: auto; padding: 10px;
      border-right: none; border-bottom: 1px solid var(--borda); position: sticky; top: 0; z-index: 5;
    }
    #lista h2 { display: none; }
    #lista div { flex-shrink: 0; margin: 0; white-space: nowrap; border: 1px solid var(--borda); }
    main { overflow: visible; padding: 20px 16px 40px; }
    #titulo { font-size: 22px; }
    .CodeMirror { height: 260px; font-size: 13px; }
    #botoes button { flex: 1; }
    #status { flex-basis: 100%; }
  }
</style>
</head>
<body>
<nav id="lista"><h2>Questões</h2></nav>
<main>
  <h1 id="titulo"></h1>
  <div id="enunciado"></div>
  <textarea id="editor"></textarea>
  <div id="botoes">
    <button id="rodar" disabled>Rodar testes</button>
    <button id="resetar">Resetar</button>
    <span id="status">Carregando Python…</span>
  </div>
  <div id="nota"></div>
  <div class="tabela">
  <table id="testes" hidden>
    <thead><tr><th>#</th><th>Entrada</th><th>Esperado</th><th>Obtido</th><th></th></tr></thead>
    <tbody></tbody>
  </table>
  </div>
</main>

<!-- Executado dentro do Web Worker, já com o Pyodide carregado -->
<script type="text/python" id="harness">
import ast, inspect, json, copy, io, contextlib, traceback, js

def _uso_proibido(codigo, q):
    try:
        arvore = ast.parse(codigo)
    except SyntaxError:
        return None  # o erro de sintaxe aparece nos testes
    proibidos = set(q.get("proibido", []))
    for no in ast.walk(arvore):
        if isinstance(no, ast.Name) and no.id in proibidos:
            return f"Uso proibido: {no.id} (linha {no.lineno})"
        if "str" in proibidos and (
            isinstance(no, ast.JoinedStr)
            or (isinstance(no, ast.Name) and no.id in ("repr", "format"))
            or (isinstance(no, ast.Attribute) and no.attr == "format")
            or (isinstance(no, ast.BinOp) and isinstance(no.op, ast.Mod)
                and isinstance(no.left, ast.Constant) and isinstance(no.left.value, str))):
            return f"Uso proibido: conversão para string (linha {no.lineno})"
        if q.get("sem_fatiamento") and isinstance(no, ast.Slice):
            return f"Uso proibido: fatiamento (linha {no.lineno})"
    return None

def _erro(e):
    if isinstance(e, SyntaxError):
        return f"SyntaxError: {e.msg} (linha {e.lineno})"
    linhas = [f.lineno for f in traceback.extract_tb(e.__traceback__) if f.filename == "<aluno>"]
    sufixo = f" (linha {linhas[-1]})" if linhas else ""
    return f"{type(e).__name__}: {e}{sufixo}"

def _testa_funcao(codigo, q, t):
    ns = {"__name__": "__main__"}
    with contextlib.redirect_stdout(io.StringIO()):
        exec(compile(codigo, "<aluno>", "exec"), ns)
        if not callable(ns.get(q["funcao"])):
            raise NameError(f"função '{q['funcao']}' não definida")
        f = ns[q["funcao"]]
        args = copy.deepcopy(t["args"])
        obtido = f(*args)
    if q.get("nao_altera_args"):
        nomes = list(inspect.signature(f).parameters)
        for i, (arg, original) in enumerate(zip(args, t["args"])):
            if arg != original:
                nome = nomes[i] if i < len(nomes) else "argumento"
                return False, repr(obtido), f"O {nome} original foi alterado"
    return obtido == t["esperado"], repr(obtido), None

def _testa_programa(codigo, q, t):
    entradas = iter(t["entradas"])
    def falso_input(prompt=""):
        try:
            return next(entradas)
        except StopIteration:
            raise EOFError("input() chamado mais vezes do que há entradas") from None
    saida = io.StringIO()
    try:
        with contextlib.redirect_stdout(saida):
            exec(compile(codigo, "<aluno>", "exec"), {"__name__": "__main__", "input": falso_input})
    except SystemExit:
        pass
    except BaseException as e:
        e.saida_parcial = saida.getvalue()
        raise
    obtidas = [l.strip() for l in saida.getvalue().splitlines()]
    while obtidas and obtidas[-1] == "":
        obtidas.pop()
    return obtidas == [l.strip() for l in t["saida"]], "\n".join(obtidas), None

def _rodar(codigo, q_json):
    q = json.loads(q_json)
    proibido = _uso_proibido(codigo, q)
    testa = _testa_funcao if q["tipo"] == "funcao" else _testa_programa
    for i, t in enumerate(q["testes"]):
        js.postMessage(json.dumps({"tipo": "inicio", "i": i}))
        try:
            if proibido:
                r = {"ok": False, "obtido": "", "erro": proibido}
            else:
                ok, obtido, erro = testa(codigo, q, t)
                r = {"ok": ok, "obtido": obtido, "erro": erro}
        except BaseException as e:
            r = {"ok": False, "obtido": getattr(e, "saida_parcial", ""), "erro": _erro(e)}
        js.postMessage(json.dumps({"tipo": "teste", "i": i, **r}))
    js.postMessage(json.dumps({"tipo": "fim"}))
</script>

<script type="text/js-worker" id="worker">
importScripts("https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js");
let pyodide;
onmessage = async (ev) => {
  if (ev.data.harness) {
    pyodide = await loadPyodide();
    pyodide.runPython(ev.data.harness);
    postMessage(JSON.stringify({ tipo: "pronto" }));
  } else {
    pyodide.globals.get("_rodar")(ev.data.codigo, ev.data.questao);
  }
};
</script>

<script>
const TIMEOUT_MS = 3000;
const $ = (id) => document.getElementById(id);
const editor = CodeMirror.fromTextArea($("editor"), {
  mode: "python", lineNumbers: true, indentUnit: 4,
  extraKeys: { Tab: (cm) => cm.replaceSelection("    ") },
});

let questoes = [], atual = null, worker = null, pronto = false, execucao = null;

// ---------- armazenamento ----------
const ler = (k) => localStorage.getItem("mpl:" + k);
const gravar = (k, v) => localStorage.setItem("mpl:" + k, v);

// ---------- utilidades ----------
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function markdown(md) {
  return md.split(/\n\s*\n/).map((bloco) => {
    const inline = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
    const linhas = bloco.split("\n");
    if (linhas.every((l) => l.startsWith("- ")))
      return "<ul>" + linhas.map((l) => "<li>" + inline(l.slice(2)) + "</li>").join("") + "</ul>";
    return "<p>" + inline(bloco) + "</p>";
  }).join("");
}

// repr estilo Python para valores vindos do JSON
function pyRepr(v) {
  if (v === true) return "True";
  if (v === false) return "False";
  if (v === null) return "None";
  if (Array.isArray(v)) return "[" + v.map(pyRepr).join(", ") + "]";
  if (typeof v === "string") return "'" + v.replace(/\\/g, "\\\\").replace(/'/g, "\\'") + "'";
  return String(v);
}

// ---------- lista e questão atual ----------
function iconeStatus(id) {
  return { passou: "🟢", falhou: "🔴" }[ler("status:" + id)] || "⚪";
}

function desenharLista() {
  const nav = $("lista");
  nav.querySelectorAll("div").forEach((d) => d.remove());
  questoes.forEach((q, n) => {
    const d = document.createElement("div");
    d.textContent = `${iconeStatus(q.id)} Q${n + 1} — ${q.titulo}`;
    if (q === atual) d.className = "ativa";
    d.onclick = () => abrir(q);
    nav.appendChild(d);
  });
}

function abrir(q) {
  if (execucao) return;
  atual = q;
  gravar("atual", q.id);
  $("titulo").textContent = q.titulo;
  $("enunciado").innerHTML = markdown(q.enunciado);
  editor.setValue(ler("codigo:" + q.id) ?? q.template);
  editor.clearHistory();
  $("nota").textContent = "";
  $("testes").hidden = true;
  desenharLista();
}

editor.on("change", () => { if (atual) gravar("codigo:" + atual.id, editor.getValue()); });

$("resetar").onclick = () => {
  if (!atual || execucao || !confirm("Apagar seu código e voltar ao template?")) return;
  localStorage.removeItem("mpl:codigo:" + atual.id);
  localStorage.removeItem("mpl:status:" + atual.id);
  abrir(atual);
};

// ---------- tabela de resultados ----------
function linhasTabela(q) {
  const tbody = $("testes").querySelector("tbody");
  tbody.innerHTML = "";
  $("testes").hidden = false;
  return q.testes.map((t, i) => {
    const entrada = q.tipo === "funcao" ? `${q.funcao}(${t.args.map(pyRepr).join(", ")})` : t.entradas.join("\n");
    const esperado = q.tipo === "funcao" ? pyRepr(t.esperado) : t.saida.join("\n");
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${i + 1}</td><td><pre>${esc(entrada)}</pre></td><td><pre>${esc(esperado)}</pre></td><td></td><td></td>`;
    tbody.appendChild(tr);
    return tr;
  });
}

function preencher(tr, ok, obtido, erro) {
  tr.cells[3].innerHTML = `<pre>${esc(obtido || "")}</pre>` + (erro ? `<pre class="erro">${esc(erro)}</pre>` : "");
  tr.cells[4].textContent = ok ? "✅" : "❌";
}

// ---------- worker (Pyodide) ----------
function iniciarWorker() {
  pronto = false;
  $("rodar").disabled = true;
  $("status").textContent = "Carregando Python…";
  const src = new Blob([$("worker").textContent], { type: "text/javascript" });
  worker = new Worker(URL.createObjectURL(src));
  worker.onmessage = (ev) => receber(JSON.parse(ev.data));
  worker.postMessage({ harness: $("harness").textContent });
}

function receber(m) {
  if (m.tipo === "pronto") {
    pronto = true;
    $("rodar").disabled = false;
    $("status").textContent = "";
    return;
  }
  const ex = execucao;
  if (!ex) return;
  clearTimeout(ex.timer);
  if (m.tipo === "inicio") {
    ex.corrente = m.i;
    ex.timer = setTimeout(estourouTempo, TIMEOUT_MS);
  } else if (m.tipo === "teste") {
    preencher(ex.linhas[m.i], m.ok, m.obtido, m.erro);
    if (m.ok) ex.acertos++;
  } else if (m.tipo === "fim") {
    terminar();
  }
}

function estourouTempo() {
  const ex = execucao;
  worker.terminate();
  for (let i = ex.corrente; i < ex.linhas.length; i++)
    preencher(ex.linhas[i], false, "", i === ex.corrente ? `Tempo esgotado (${TIMEOUT_MS / 1000}s) — loop infinito?` : "Não executado");
  iniciarWorker();
  terminar();
}

function terminar() {
  const ex = execucao;
  execucao = null;
  const n = ex.linhas.length;
  $("nota").textContent = `Nota: ${ex.acertos}/${n}`;
  gravar("status:" + ex.q.id, ex.acertos === n ? "passou" : "falhou");
  $("rodar").disabled = !pronto;
  $("status").textContent = pronto ? "" : $("status").textContent;
  desenharLista();
}

$("rodar").onclick = () => {
  if (!pronto || execucao || !atual) return;
  $("rodar").disabled = true;
  $("nota").textContent = "";
  execucao = { q: atual, linhas: linhasTabela(atual), acertos: 0, corrente: 0, timer: null };
  execucao.timer = setTimeout(estourouTempo, TIMEOUT_MS);
  worker.postMessage({ codigo: editor.getValue(), questao: JSON.stringify(atual) });
};

// ---------- início ----------
(async () => {
  const ids = await (await fetch("questoes/index.json")).json();
  questoes = await Promise.all(ids.map(async (id) => (await fetch(`questoes/${id}.json`)).json()));
  abrir(questoes.find((q) => q.id === ler("atual")) || questoes[0]);
  iniciarWorker();
})();
</script>
</body>
